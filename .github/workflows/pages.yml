name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Create stable I did it aliases
        run: |
          cp common-pages/i-did-it/index.html i-did-it.html
          cp common-pages/i-did-it/privacy-policy.html i-did-it-privacy-policy.html
          cp common-pages/i-did-it/terms.html i-did-it-terms.html
          cp common-pages/i-did-it/support.html i-did-it-support.html
          cp common-pages/i-did-it/feedback.html i-did-it-feedback.html
          cp common-pages/i-did-it/data-deletion.html i-did-it-data-deletion.html
          cp common-pages/i-did-it/invite/index.html i-did-it-invite.html
          cp common-pages/i-did-it/favicon.svg i-did-it-favicon.svg
          cp common-pages/i-did-it/styles.css i-did-it-styles.css
          cp common-pages/i-did-it/typography.css i-did-it-typography.css
          sed -i \
            -e 's|href="../styles.css"|href="i-did-it-styles.css"|g' \
            -e 's|href="styles.css"|href="i-did-it-styles.css"|g' \
            -e 's|href="typography.css"|href="i-did-it-typography.css"|g' \
            -e 's|href="../favicon.svg"|href="i-did-it-favicon.svg"|g' \
            -e 's|href="favicon.svg"|href="i-did-it-favicon.svg"|g' \
            -e 's|href="index.html"|href="i-did-it.html"|g' \
            -e 's|href="privacy-policy.html"|href="i-did-it-privacy-policy.html"|g' \
            -e 's|href="terms.html"|href="i-did-it-terms.html"|g' \
            -e 's|href="support.html"|href="i-did-it-support.html"|g' \
            -e 's|href="feedback.html"|href="i-did-it-feedback.html"|g' \
            -e 's|href="data-deletion.html"|href="i-did-it-data-deletion.html"|g' \
            i-did-it.html i-did-it-*.html
      - name: Publish Hirameki Orbit at its dedicated URL
        run: cp -R common-pages/hirameki-orbit hirameki-orbit
      - name: Upload site
        uses: actions/upload-pages-artifact@v4
        with:
          path: .
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
